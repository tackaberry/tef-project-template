trigger: none # We will trigger this manually or from a work item
pr: none

pool:
  vmImage: 'ubuntu-latest'

parameters:
  # These would be set by the work item trigger or at runtime
  - name: WorkItemID
  - name: ProjectName
  - name: EditorGroup  

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.x'
  displayName: 'Use Python 3.x'

- script: |
    pip install --upgrade pip
    # No external libraries are needed for the python script
  displayName: 'Install dependencies'

- script: |
    # Create a new branch for the PR
    git checkout -b feature/wi-$(WorkItemID)
  displayName: 'Create New Branch'

- script: |
    echo "Adding project to projects.json"
    cat projects.json
    echo "==============================================================================\n"
    python add_project.py
    echo "==============================================================================\n"
    echo "Updated projects.json:"
    cat projects.json
  displayName: 'Add Project to JSON'
  env:
    PROJECT_NAME: ${{ parameters.ProjectName }}
    EDITOR_GROUP: ${{ parameters.EditorGroup }}

- script: |
    git config --global user.email "pipeline@azuredevops.com"
    git config --global user.name "Azure DevOps Pipeline"
    git add projects.json
    git commit -m "feat: Add project '$(ProjectName)' from work item $(WorkItemID)"
    git push --set-upstream origin feature/wi-$(WorkItemID)
  displayName: 'Commit and Push Changes'

- task: CreatePullRequest@1
  # need to install https://marketplace.visualstudio.com/items?itemName=ShaykiAbramczyk.CreatePullRequest
  inputs:
    repositoryName: '$(Build.Repository.Name)'
    sourceBranch: 'refs/heads/feature/wi-$(WorkItemID)'
    targetBranch: 'refs/heads/main' # Or your default branch
    title: 'feat: Add project ''$(ProjectName)'' from work item $(WorkItemID)'
    description: 'This PR was automatically created from work item $(WorkItemID).'
