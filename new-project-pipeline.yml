name: new-project-$(Date:yy).$(Date:MM).0.$(BuildID)-$(Date:yyyyMMdd)-$(Date:HHmm)

trigger: none # We will trigger this manually or from a work item
pr: none

pool:
  vmImage: 'ubuntu-latest'

parameters:
  # These would be set by the work item trigger or at runtime
  - name: WorkItemID
  - name: ProjectName
  - name: EditorGroup
  - name: DataClassification

variables:
  targetBranch: 'plan' 
  environment: 'development'
  folderPath: "envs/development/group/group-1"


steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.x'
  displayName: 'Use Python 3.x'
- checkout: self
  persistCredentials: true

- script: |
    pip install --upgrade pip
    # No external libraries are needed for the python script
  displayName: 'Install dependencies'

- script: |
    # Create a new branch for the PR
    git checkout -b feature/wi-${{ parameters.WorkItemID }}
  displayName: 'Create New Branch'

- script: |
    echo "Adding project to projects.json"
    cat projects.json
    echo "==============================================================================\n"
    python add_project.py
    echo "==============================================================================\n"
    echo "Updated projects.json:"
    cat $(folderPath)/projects.json
  displayName: 'Add Project to JSON'
  env:
    PROJECT_NAME: ${{ parameters.ProjectName }}
    EDITOR_GROUP: ${{ parameters.EditorGroup }}
    DATA_CLASSIFICATION: ${{ parameters.DataClassification }}
    WORK_ITEM_ID: ${{ parameters.WorkItemID }}
    FOLDER_PATH: $(folderPath)

- script: |
    git config --global user.email "pipeline@azuredevops.com"
    git config --global user.name "Azure DevOps Pipeline"
    git add $(folderPath)/projects.json
    git commit -m "feat: Add project '${{ parameters.ProjectName }}' from work item ${{ parameters.WorkItemID }} [skip ci]"
    git push --set-upstream origin feature/wi-${{ parameters.WorkItemID }}
  displayName: 'Commit and Push Changes'

- script: | 
    API_URL="$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_apis/git/repositories/$(Build.Repository.ID)/pullrequests?api-version=7.1"
    SOURCE_BRANCH="feature/wi-${{ parameters.WorkItemID }}"
    
    JSON_BODY=$(cat <<EOF
    {
      "sourceRefName": "refs/heads/$SOURCE_BRANCH",
      "targetRefName": "refs/heads/$(targetBranch)",
      "title": "PR from pipeline: $SOURCE_BRANCH",
      "description": "Automated PR created by the pipeline for branch $SOURCE_BRANCH."
    }
    EOF
    )
    echo "Creating pull request from $SOURCE_BRANCH to $(targetBranch)..."
    echo "API URL: $API_URL"
    echo "Request Body: $JSON_BODY"

    RESPONSE=$(curl -s -X POST -H "Content-Type: application/json" -H "Authorization: Bearer $AZURE_DEVOPS_TOKEN" -d "$JSON_BODY" "$API_URL")

    echo "Response: $RESPONSE"
  displayName: 'Create Pull Request via REST API'
  env:
    AZURE_DEVOPS_TOKEN: $(System.AccessToken)
